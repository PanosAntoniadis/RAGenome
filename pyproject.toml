[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragenome"
version = "0.1.0"
description = "RAGenome: pretraining code for a retrieval-based genomic language model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.0",
    "lightning==2.6.1",
    "transformers==4.44.2",
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "omegaconf==2.3.0",
    "einops==0.8.0",
    "zarr==3.1.6",
    "pysam==0.22.1",
    "pyBigWig==0.3.23",
    "pandas==2.2.2",
    "numpy==2.1.2",
    "scipy==1.14.1",
]

[tool.setuptools.packages.find]
include = ["ragenome", "ragenome.*"]

[tool.setuptools.package-data]
ragenome = ["tokenizers/*.json"]
