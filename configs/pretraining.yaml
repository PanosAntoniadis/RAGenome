defaults:
  # data
  - data: default
  - loading@sequence_mask: span_mask_collator
  # model
  - model: masked_lm
  - model/nn: ragenome_transformer
  - model/optimizer: adamw
  - model/lr_scheduler: cosine_warmup
  # trainer
  - trainer: default
  # loss
  - losses@model.mlm_criterion: weighted_ce_loss
  # other
  - callbacks: default
  - paths: default
  - hydra: default
  - logger: csv
  - _self_

task_name: pretraining
run_name: ragenome

trainer:
  max_steps: 500000
  accumulate_grad_batches: 8
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 50

ckpt_path: null
